[project]
name = "whatiz"
version = "0.1.0"
description = "A lightweight CLI tool to get quick information about any topic using DuckDuckGo search"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["cli", "search", "duckduckgo", "information", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Search",
    "Topic :: Utilities",
]
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "ddgs (>=9.10.0,<10.0.0)",
    "sumy (>=0.12.0,<0.13.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/yourusername/whatiz"
Documentation = "https://github.com/yourusername/whatiz#readme"
Repository = "https://github.com/yourusername/whatiz"
Issues = "https://github.com/yourusername/whatiz/issues"

[project.scripts]
whatiz = "whatiz.main:main"

[tool.poetry]
packages = [{include = "whatiz", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
